spring.application.name=reembolsos-integrado

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:reembolsos
spring.jpa.open-in-view=false

# El mapeo JPA de SolicitudReembolso vive en XML para que el dominio
# no importe jakarta.persistence
spring.jpa.mapping-resources=META-INF/orm.xml
